[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "musicmakerlm"
version = "0.1.0"
description = "Generate, analyze, and teach music — symbolic core, local-first AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "music21>=9.1",
    "pretty_midi>=0.2.10",
    "midiutil>=1.2.1",
    "mido>=1.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
]

[project.scripts]
musicmakerlm = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = false
ignore_missing_imports = true
